<!DOCTYPE html>
<html>
<head>
  <title>Gravity Flip 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #status {
      position: absolute;
      top: 10px;
      left: 20px;
      color: white;
      font-family: monospace;
      font-size: 24px;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 10px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="status">🌌 Gravity Flip Mode: FLOOR</div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);

    // Player
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1,1,1),
      new THREE.MeshStandardMaterial({ color: 0x00ff00 })
    );
    player.position.set(0, 0, 10);
    scene.add(player);

    // Ground & Ceiling
    const floor = new THREE.Mesh(new THREE.BoxGeometry(20, 0.1, 100), new THREE.MeshStandardMaterial({ color: 0x2222aa }));
    floor.position.y = -1;
    scene.add(floor);

    const ceiling = new THREE.Mesh(new THREE.BoxGeometry(20, 0.1, 100), new THREE.MeshStandardMaterial({ color: 0xaa2222 }));
    ceiling.position.y = 2;
    scene.add(ceiling);

    // Obstacles
    const obstacles = [];
    function spawnObstacle() {
      const obs = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 1.5, 1.5),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      obs.position.z = -100;
      obs.position.x = (Math.floor(Math.random() * 5) - 2) * 2;
      obs.position.y = gravityFlipped ? 1.2 : -0.2;
      scene.add(obs);
      obstacles.push(obs);
    }

    setInterval(spawnObstacle, 1500);

    camera.position.set(0, 2, 20);
    camera.lookAt(player.position);

    // Controls
    let vx = 0;
    let gravityFlipped = false;
    const status = document.getElementById("status");

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") vx = -0.2;
      if (e.key === "ArrowRight") vx = 0.2;
      if (e.code === "Space") {
        gravityFlipped = !gravityFlipped;
        player.position.y = gravityFlipped ? 1.5 : 0;
        status.textContent = gravityFlipped ? "🌌 Gravity Flip Mode: CEILING" : "🌌 Gravity Flip Mode: FLOOR";
      }
    });

    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") vx = 0;
    });

    let gameOver = false;

    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);

      player.position.x += vx;

      obstacles.forEach(obs => {
        obs.position.z += 0.5;

        if (
          Math.abs(obs.position.z - player.position.z) < 1 &&
          Math.abs(obs.position.x - player.position.x) < 1 &&
          Math.abs(obs.position.y - player.position.y) < 1
        ) {
          status.textContent = "💀 YOU GOT SMACKED! Press F5 to Retry.";
          gameOver = true;
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
